global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules
rule_files:
  - "alerts.yml"

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # System metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

  # Redis metrics
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']

  # MySQL metrics
  - job_name: 'mysql'
    static_configs:
      - targets: ['mysql-exporter:9104']

  # Go services metrics 
  - job_name: 'academic-service'
    static_configs:
      - targets: ['host.docker.internal:9091']
    metrics_path: /metrics
    scheme: http

  - job_name: 'user-service'
    static_configs:
      - targets: ['host.docker.internal:9096']
    metrics_path: /metrics
    scheme: http

  - job_name: 'file-service'
    static_configs:
      - targets: ['host.docker.internal:9093']
    metrics_path: /metrics
    scheme: http

  - job_name: 'thesis-service'
    static_configs:
      - targets: ['host.docker.internal:9095']
    metrics_path: /metrics
    scheme: http

  - job_name: 'council-service'
    static_configs:
      - targets: ['host.docker.internal:9092']
    metrics_path: /metrics
    scheme: http

  - job_name: 'role-service'
    static_configs:
      - targets: ['host.docker.internal:9094']
    metrics_path: /metrics
    scheme: http

  # GraphQL Gateway
  - job_name: 'graphql-gateway'
    static_configs:
      - targets: ['host.docker.internal:8080']
    metrics_path: /metrics
    scheme: http

  # Plagiarism Checker Service
  - job_name: 'plagiarism-service'
    static_configs:
      - targets: ['host.docker.internal:3000']
    metrics_path: /metrics
    scheme: http