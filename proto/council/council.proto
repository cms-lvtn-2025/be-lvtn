syntax = "proto3";

package council;

option go_package = "./council";

import "google/protobuf/timestamp.proto";
import "proto/common/common.proto";

// ============= Enums =============
enum DefencePosition {
  PRESIDENT = 0;
  SECRETARY = 1;
  REVIEWER = 2;
  MEMBER = 3;
}

// ============= Council =============
message Council {
  string id = 1;
  string title = 2;
  string major_code = 3;
  string semester_code = 4;
  google.protobuf.Timestamp time_start = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string created_by = 8;
  string updated_by = 9;
}

message CouncilAction {
  string title = 1;
  string major_code = 2;
  string semester_code = 3;
  google.protobuf.Timestamp time_start = 4;
  string created_by = 5;
  string updated_by = 6;
}

message GetCouncilRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message CreateCouncilRequest {
  CouncilAction council = 1;
}

message UpdateCouncilRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
  CouncilAction council = 3;
}

message DeleteCouncilRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message CouncilResponse {
  Council council = 1;
}

message DeleteCouncilResponse {
  bool success = 1;
}

message ListCouncilsRequest {
  common.SearchRequest search = 1;
}

message ListCouncilsResponse {
  repeated Council councils = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============= Defence =============
message Defence {
  string id = 1;
  string title = 2;
  string council_code = 3;
  string teacher_code = 4;
  DefencePosition position = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string created_by = 8;
  string updated_by = 9;
}

message DefenceAction {
  string title = 1;
  string council_code = 2;
  string teacher_code = 3;
  DefencePosition position = 4;
  string created_by = 5;
  string updated_by = 6;
}

message GetDefenceRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message CreateDefenceRequest {
  DefenceAction defence = 1;
}

message UpdateDefenceRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
  DefenceAction defence = 3;
}

message DeleteDefenceRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message DefenceResponse {
  Defence defence = 1;
}

message DeleteDefenceResponse {
  bool success = 1;
}

message ListDefencesRequest {
  common.SearchRequest search = 1;
}

message ListDefencesResponse {
  repeated Defence defences = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============= GradeDefence =============
message GradeDefence {
  string id = 1;
  string defence_code = 2;
  string enrollment_code = 3;
  string note = 4;
  int32 total_score = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string created_by = 8;
  string updated_by = 9;
}

message GradeDefenceAction {
  string defence_code = 1;
  string enrollment_code = 2;
  string note = 3;
  int32 total_score = 4;
  string created_by = 5;
  string updated_by = 6;
}

message GetGradeDefenceRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message CreateGradeDefenceRequest {
  GradeDefenceAction grade_defence = 1;
}

message UpdateGradeDefenceRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
  GradeDefenceAction grade_defence = 3;
}

message DeleteGradeDefenceRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message GradeDefenceResponse {
  GradeDefence grade_defence = 1;
}

message DeleteGradeDefenceResponse {
  bool success = 1;
}

message ListGradeDefencesRequest {
  common.SearchRequest search = 1;
}

message ListGradeDefencesResponse {
  repeated GradeDefence grade_defences = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============= GradeDefenceCriterion =============
message GradeDefenceCriterion {
  string id = 1;
  string grade_defence_code = 2;
  string name = 3;
  string score = 4;
  string maxScore = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string created_by = 8;
  string updated_by = 9;
}

message GradeDefenceCriterionAction {
  string grade_defence_code = 1;
  string name = 2;
  string score = 3;
  string maxScore = 4;
  string created_by = 5;
  string updated_by = 6;
}

message GetGradeDefenceCriterionRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message CreateGradeDefenceCriterionRequest {
  GradeDefenceCriterionAction grade_defence_criterion = 1;
}

message UpdateGradeDefenceCriterionRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
  GradeDefenceCriterionAction grade_defence_criterion = 3;
}

message DeleteGradeDefenceCriterionRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message GradeDefenceCriterionResponse {
  GradeDefenceCriterion grade_defence_criterion = 1;
}

message DeleteGradeDefenceCriterionResponse {
  bool success = 1;
}

message ListGradeDefenceCriteriaRequest {
  common.SearchRequest search = 1;
}

message ListGradeDefenceCriteriaResponse {
  repeated GradeDefenceCriterion grade_defence_criteria = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============= Service =============
service CouncilService {
  // Council
  rpc CreateCouncil(CreateCouncilRequest) returns (CouncilResponse);
  rpc GetCouncil(GetCouncilRequest) returns (CouncilResponse);
  rpc UpdateCouncil(UpdateCouncilRequest) returns (CouncilResponse);
  rpc DeleteCouncil(DeleteCouncilRequest) returns (DeleteCouncilResponse);
  rpc ListCouncils(ListCouncilsRequest) returns (ListCouncilsResponse);

  // Defence
  rpc CreateDefence(CreateDefenceRequest) returns (DefenceResponse);
  rpc GetDefence(GetDefenceRequest) returns (DefenceResponse);
  rpc UpdateDefence(UpdateDefenceRequest) returns (DefenceResponse);
  rpc DeleteDefence(DeleteDefenceRequest) returns (DeleteDefenceResponse);
  rpc ListDefences(ListDefencesRequest) returns (ListDefencesResponse);

  // GradeDefence
  rpc CreateGradeDefence(CreateGradeDefenceRequest) returns (GradeDefenceResponse);
  rpc GetGradeDefence(GetGradeDefenceRequest) returns (GradeDefenceResponse);
  rpc UpdateGradeDefence(UpdateGradeDefenceRequest) returns (GradeDefenceResponse);
  rpc DeleteGradeDefence(DeleteGradeDefenceRequest) returns (DeleteGradeDefenceResponse);
  rpc ListGradeDefences(ListGradeDefencesRequest) returns (ListGradeDefencesResponse);

  // GradeDefenceCriterion
  rpc CreateGradeDefenceCriterion(CreateGradeDefenceCriterionRequest) returns (GradeDefenceCriterionResponse);
  rpc GetGradeDefenceCriterion(GetGradeDefenceCriterionRequest) returns (GradeDefenceCriterionResponse);
  rpc UpdateGradeDefenceCriterion(UpdateGradeDefenceCriterionRequest) returns (GradeDefenceCriterionResponse);
  rpc DeleteGradeDefenceCriterion(DeleteGradeDefenceCriterionRequest) returns (DeleteGradeDefenceCriterionResponse);
  rpc ListGradeDefenceCriteria(ListGradeDefenceCriteriaRequest) returns (ListGradeDefenceCriteriaResponse);
}
