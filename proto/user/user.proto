syntax = "proto3";

package user;

option go_package = "./user";

import "google/protobuf/timestamp.proto";
import "proto/common/common.proto";

enum Gender {
  MALE = 0;
  FEMALE = 1;
  OTHER = 2;
}

// ============= Student =============
message Student {
  string id = 1;
  string email = 2;
  string phone = 3;
  string username = 4;
  Gender gender = 5;
  string major_code = 6;
  string class_code = 7;
  string semester_code = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  string created_by = 11;
  string updated_by = 12;
  string mssv = 13;
}

message StudentAction {
  string id = 1;
  string email = 2;
  string phone = 3;
  string username = 4;
  Gender gender = 5;
  string major_code = 6;
  string class_code = 7;
  string semester_code = 8;
  string mssv = 9;
  string created_by = 10;
  string updated_by = 11;
}

message StudentResponse {
  Student student = 1;
}

message CreateStudentRequest {
  StudentAction student = 1;
}

message GetStudentRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message UpdateStudentRequest {
  string id = 1;
  StudentAction student = 2;
  repeated common.FilterCriteria filter = 3;
}

message DeleteStudentRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message DeleteStudentResponse {
  bool success = 1;
}

message ListStudentsRequest {
  common.SearchRequest search = 1;
}

message ListStudentsResponse {
  repeated Student students = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============= Teacher =============
message Teacher {
  string id = 1;
  string email = 2;
  string username = 3;
  Gender gender = 4;
  string major_code = 5;
  string semester_code = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  string created_by = 9;
  string updated_by = 10;
  string msgv = 11;
}

message TeacherAction {
  string id = 1;
  string email = 2;
  string username = 3;
  Gender gender = 4;
  string major_code = 5;
  string semester_code = 6;
  string msgv = 7;
  string created_by = 8;
  string updated_by = 9;
}

message TeacherResponse {
  Teacher teacher = 1;
}

message CreateTeacherRequest {
  TeacherAction teacher = 1;
}

message GetTeacherRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message UpdateTeacherRequest {
  string id = 1;
  TeacherAction teacher = 2;
  repeated common.FilterCriteria filter = 3;
}

message DeleteTeacherRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message DeleteTeacherResponse {
  bool success = 1;
}

message ListTeachersRequest {
  common.SearchRequest search = 1;
}

message ListTeachersResponse {
  repeated Teacher teachers = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============= Service =============
service UserService {
  // Student
  rpc CreateStudent(CreateStudentRequest) returns (StudentResponse);
  rpc GetStudent(GetStudentRequest) returns (StudentResponse);
  rpc UpdateStudent(UpdateStudentRequest) returns (StudentResponse);
  rpc DeleteStudent(DeleteStudentRequest) returns (DeleteStudentResponse);
  rpc ListStudents(ListStudentsRequest) returns (ListStudentsResponse);

  // Teacher
  rpc CreateTeacher(CreateTeacherRequest) returns (TeacherResponse);
  rpc GetTeacher(GetTeacherRequest) returns (TeacherResponse);
  rpc UpdateTeacher(UpdateTeacherRequest) returns (TeacherResponse);
  rpc DeleteTeacher(DeleteTeacherRequest) returns (DeleteTeacherResponse);
  rpc ListTeachers(ListTeachersRequest) returns (ListTeachersResponse);
}
