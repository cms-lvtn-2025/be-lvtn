  syntax = "proto3";

package file;

option go_package = "./file";

import "google/protobuf/timestamp.proto";
import "proto/common/common.proto";

enum FileStatus {
  FILE_PENDING = 0;
  APPROVED = 1;
  REJECTED = 2;
}

enum TableType {
  TOPIC = 0;
  MIDTERM = 1;
  FINAL = 2;
  ORDER = 3;
}

// ============= File =============
message File {
  string id = 1;
  string title = 2;
  string file = 3;
  FileStatus status = 4;
  TableType table = 5;
  string option = 6;
  string table_id = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  string created_by = 10;
  string updated_by = 11;
}

message FileAction {
  string title = 1;
  string file = 2;
  FileStatus status = 3;
  TableType table = 4;
  string option = 5;
  string table_id = 6;
  string created_by = 7;
  string updated_by = 8;
}

message FileResponse {
  File file = 1;
}

message CreateFileRequest {
  FileAction file = 1;
}

message GetFileRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message UpdateFileRequest {
  string id = 1;
  FileAction file = 2;
  repeated common.FilterCriteria filter = 3;
}

message DeleteFileRequest {
  string id = 1;
  repeated common.FilterCriteria filter = 2;
}

message DeleteFileResponse {
  bool success = 1;
}

message ListFilesRequest {
  common.SearchRequest search = 1;
}

message ListFilesResponse {
  repeated File files = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ============= Service =============
service FileService {
  rpc CreateFile(CreateFileRequest) returns (FileResponse);
  rpc GetFile(GetFileRequest) returns (FileResponse);
  rpc UpdateFile(UpdateFileRequest) returns (FileResponse);
  rpc DeleteFile(DeleteFileRequest) returns (DeleteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
}
