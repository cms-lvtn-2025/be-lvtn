# ============================================
# GQLGEN CONFIGURATION - Schema 2 (New)
# Nested Query + Unified Types + Field-level RBAC
# ============================================

schema:
  - src/server/graph/schema_2/*.graphqls

exec:
  package: generated
  layout: follow-schema
  dir: src/server/graph/generated
  filename_template: "{name}.generated.go"

model:
  filename: src/server/graph/model/models_gen.go
  package: model

resolver:
  package: resolver
  layout: follow-schema
  dir: src/server/graph/resolver
  filename_template: "{name}.resolvers.go"

models:
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32

  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int32

  Int64:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64

  Time:
    model:
      - github.com/99designs/gqlgen/graphql.Time

  # ============================================
  # ROOT QUERY & MUTATION - Entry Points
  # ============================================
  Query:
    fields:
      student:
        resolver: true
      teacher:
        resolver: true
      affair:
        resolver: true
      department:
        resolver: true

  Mutation:
    fields:
      student:
        resolver: true
      teacher:
        resolver: true
      affair:
        resolver: true
      department:
        resolver: true

  # ============================================
  # QUERY NAMESPACES
  # ============================================
  StudentQuery:
    fields:
      me:
        resolver: true
      enrollments:
        resolver: true
      semesters:
        resolver: true

  TeacherQuery:
    fields:
      me:
        resolver: true
      supervisor:
        resolver: true
      council:
        resolver: true

  SupervisorQuery:
    fields:
      topicCouncils:
        resolver: true

  CouncilMemberQuery:
    fields:
      defences:
        resolver: true


  AffairQuery:
    fields:
      teachers:
        resolver: true
      teacherDetail:
        resolver: true
      students:
        resolver: true
      studentDetail:
        resolver: true
      semesters:
        resolver: true
      semesterDetail:
        resolver: true
      majors:
        resolver: true
      majorDetail:
        resolver: true
      faculties:
        resolver: true
      facultyDetail:
        resolver: true
      topics:
        resolver: true
      topicDetail:
        resolver: true
      enrollments:
        resolver: true
      enrollmentDetail:
        resolver: true
      councils:
        resolver: true
      councilDetail:
        resolver: true
      defencesByCouncil:
        resolver: true
      gradeDefences:
        resolver: true

  DepartmentQuery:
    fields:
      teachers:
        resolver: true
      students:
        resolver: true
      semesters:
        resolver: true
      majors:
        resolver: true
      faculties:
        resolver: true
      topics:
        resolver: true
      enrollments:
        resolver: true
      councils:
        resolver: true
      gradeDefences:
        resolver: true

  # ============================================
  # MUTATION NAMESPACES
  # ============================================
  StudentMutation:
    fields:
      uploadMidtermFile:
        resolver: true
      uploadFinalFile:
        resolver: true

  TeacherMutation:
    fields:
      updateProfile:
        resolver: true
      supervisor:
        resolver: true
      council:
        resolver: true

  SupervisorMutation:
    fields:
      createTopic:
        resolver: true
      createTopicCouncil:
        resolver: true
      gradeMidterm:
        resolver: true
      feedbackMidterm:
        resolver: true
      gradeFinal:
        resolver: true
      feedbackFinal:
        resolver: true
      approveMidtermFile:
        resolver: true
      rejectMidtermFile:
        resolver: true
      approveFinalFile:
        resolver: true
      rejectFinalFile:
        resolver: true

  CouncilMemberMutation:
    fields:
      createGradeDefence:
        resolver: true
      updateGradeDefence:
        resolver: true
      addCriterion:
        resolver: true
      updateCriterion:
        resolver: true
      deleteCriterion:
        resolver: true


  AffairMutation:
    fields:
      createTeacher:
        resolver: true
      updateTeacher:
        resolver: true
      deleteTeacher:
        resolver: true
      createStudent:
        resolver: true
      updateStudent:
        resolver: true
      deleteStudent:
        resolver: true
      createSemester:
        resolver: true
      updateSemester:
        resolver: true
      deleteSemester:
        resolver: true
      createMajor:
        resolver: true
      updateMajor:
        resolver: true
      deleteMajor:
        resolver: true
      createFaculty:
        resolver: true
      updateFaculty:
        resolver: true
      deleteFaculty:
        resolver: true
      approveCouncil:
        resolver: true
      updateCouncil:
        resolver: true
      deleteCouncil:
        resolver: true
      approveTopic:
        resolver: true
      rejectTopic:
        resolver: true
      updateTopic:
        resolver: true
      deleteTopic:
        resolver: true

  DepartmentMutation:
    fields:
      createCouncil:
        resolver: true
      updateCouncil:
        resolver: true
      addDefence:
        resolver: true
      removeDefence:
        resolver: true
      approveTopicStage1:
        resolver: true
      rejectTopicStage1:
        resolver: true
      assignTopicToCouncil:
        resolver: true
      removeTopicFromCouncil:
        resolver: true

  # ============================================
  # ENTITY TYPES - Field-level RBAC
  # ============================================
  Student:
    fields:
      enrollments:
        resolver: true

  Teacher:
    fields:
      roles:
        resolver: true

  Topic:
    fields:
      major:
        resolver: true
      semester:
        resolver: true
      files:
        resolver: true
      topicCouncils:
        resolver: true

  TopicCouncil:
    fields:
      topic:
        resolver: true
      council:
        resolver: true
      enrollments:
        resolver: true
      supervisors:
        resolver: true

  TopicCouncilSupervisor:
    fields:
      teacher:
        resolver: true

  Enrollment:
    fields:
      student:
        resolver: true
      midterm:
        resolver: true
      final:
        resolver: true
      topicCouncil:
        resolver: true
      gradeDefences:
        resolver: true
  Midterm:
    fields:
      files:
        resolver: true
  Final:
    fields:
      files:
        resolver: true


  Council:
    fields:
      major:
        resolver: true
      semester:
        resolver: true
      defences:
        resolver: true
      topicCouncils:
        resolver: true

  Defence:
    fields:
      council:
        resolver: true
      teacher:
        resolver: true
      gradeDefences:
        resolver: true

  GradeDefence:
    fields:
      defence:
        resolver: true
      enrollment:
        resolver: true
      criteria:
        resolver: true

  Faculty:
    fields:
      majors:
        resolver: true
