name: DABE

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USERNAME: thaily
  GO_VERSION: '1.24'

jobs:
  # Run tests before building
  run-tests:
    name: Run Tests
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  build-and-push:
    needs: run-tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service: [academic, council, file, role, thesis, user, server]
        include:
          - service: server
            dockerfile_path: src/server/Dockerfile
          - service: academic
            dockerfile_path: src/service/academic/Dockerfile
          - service: council
            dockerfile_path: src/service/council/Dockerfile
          - service: file
            dockerfile_path: src/service/file/Dockerfile
          - service: role
            dockerfile_path: src/service/role/Dockerfile
          - service: thesis
            dockerfile_path: src/service/thesis/Dockerfile
          - service: user
            dockerfile_path: src/service/user/Dockerfile

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_USERNAME }}/lvtn-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.DOCKER_USERNAME }}/lvtn-${{ matrix.service }}:buildcache
          cache-to: type=registry,ref=${{ env.DOCKER_USERNAME }}/lvtn-${{ matrix.service }}:buildcache,mode=max

      - name: Image digest
        run: echo "Image pushed with tags ${{ steps.meta.outputs.tags }}"
