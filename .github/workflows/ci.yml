name: CI Pipeline

on:
  pull_request:
    branches: [main, develop, test]
  push:
    branches: [develop, test]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'

jobs:
  # Job 1: Quick validation
  validate:
    name: Quick Validation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
      
      - name: Check formatting
        run: |
          if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
            echo "Code is not formatted. Run: gofmt -s -w ."
            gofmt -s -l .
            exit 1
          fi
      
      - name: Run go vet
        run: go vet ./...

  # Job 2: Run all tests
  test:
    name: All Tests
    needs: validate
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # Job 3: Check test coverage
  coverage-check:
    name: Coverage Check
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Run tests with coverage
        run: |
          go test ./... -coverprofile=coverage.out -covermode=atomic -timeout=5m
          go tool cover -func=coverage.out -o=coverage.txt
      
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          
          # Set minimum coverage threshold (e.g., 70%)
          THRESHOLD=70
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "❌ Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          else
            echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%"
          fi
      
      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = fs.readFileSync('coverage.txt', 'utf8');
            const lines = coverage.trim().split('\n');
            const total = lines[lines.length - 1];
            
            const comment = `## 📊 Test Coverage Report\n\n${total}\n\nFull coverage: [View Details](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # Job 4: Security scan
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: validate
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Run Gosec Security Scanner
        uses: securego/gosec@master
        with:
          args: '-no-fail -fmt sarif -out results.sarif ./...'
      
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif

  # Job 5: Build check
  build-check:
    name: Build Check
    runs-on: ubuntu-latest
    needs: test
    
    strategy:
      matrix:
        service: [academic, council, file, role, thesis, user, server]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      
      - name: Build ${{ matrix.service }}
        run: |
          if [ "${{ matrix.service }}" == "server" ]; then
            cd src/server
            go build -v -o ../../bin/server
          else
            cd src/service/${{ matrix.service }}
            go build -v -o ../../../bin/${{ matrix.service }}
          fi
      
      - name: Verify binary
        run: |
          if [ "${{ matrix.service }}" == "server" ]; then
            ls -lh bin/server
          else
            ls -lh bin/${{ matrix.service }}
          fi

  # Final status check
  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [validate, test, coverage-check, security, build-check]
    if: always()
    
    steps:
      - name: Check all jobs
        run: |
          if [ "${{ needs.validate.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.coverage-check.result }}" != "success" ] || \
             [ "${{ needs.security.result }}" != "success" ] || \
             [ "${{ needs.build-check.result }}" != "success" ]; then
            echo "❌ CI Pipeline failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
